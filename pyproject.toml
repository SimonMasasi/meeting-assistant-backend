[project]
name = "meeting-assistant-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "bcrypt>=5.0.0",
    "boto3>=1.43.14",
    "fastapi[standard]>=0.136.1",
    "faster-whisper>=1.2.1",
    "google-auth>=2.56.0",
    "httpx>=0.28.1",
    "psycopg2>=2.9.12",
    "pyannote-audio>=4.0.4",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.13.0",
    "python-magic>=0.4.27",
    "scalar-fastapi>=1.8.2",
    "sqlmodel>=0.0.38",
    "torch>=2.12.0",
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pre-commit>=4.6.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]
